name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Hop ${{ matrix.hop }} / Python ${{ matrix.python }} / Django ${{ matrix.django }} / CMS ${{ matrix.cms }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hop: 0
            python: '3.10'
            django: '2.2.28'
            cms: '3.7.4'
          - hop: 1
            python: '3.11'
            django: '3.2.24'
            cms: '3.10.1'
          - hop: 2
            python: '3.11'
            django: '3.2.24'
            cms: '3.11.11'
          - hop: 3
            python: '3.11'
            django: '3.2.24'
            cms: '4.1.11'
          - hop: 4
            python: '3.12'
            django: '4.2.30'
            cms: '4.1.11'
          - hop: 5
            python: '3.12'
            django: '4.2.30'
            cms: '5.0.10'
          - hop: 6
            python: '3.13'
            django: '5.2.17'
            cms: '5.0.10'
          - hop: 7
            python: '3.14'
            django: '6.1'
            cms: '5.1.1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            tests/hops/*.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt -r "tests/hops/hop-${{ matrix.hop }}.txt"
          python -m pip install --no-deps --editable .
          python -m pip check

      - name: Run tests
        run: >-
          python -m pytest
          --cov=cmsplugin_poll
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --junitxml=test-results.xml

      - name: Report to CI Monitor
        if: >-
          always() &&
          github.event_name == 'push' &&
          github.repository == 'datakortet/cmsplugin-poll' &&
          github.ref == 'refs/heads/master'
        continue-on-error: true
        env:
          CIMONITOR_INGEST_TOKEN: ${{ secrets.CIMONITOR_INGEST_TOKEN }}
          TEST_JOB_STATUS: ${{ job.status }}
          TEST_HOP: ${{ matrix.hop }}
          TEST_PYTHON_VERSION: ${{ matrix.python }}
          TEST_DJANGO_VERSION: ${{ matrix.django }}
          TEST_DJANGO_CMS_VERSION: ${{ matrix.cms }}
        run: python scripts/report_to_cimonitor.py
